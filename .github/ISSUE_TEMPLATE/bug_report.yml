name: Bug report
description: Report a problem with portly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much
        information as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or commands that trigger the bug.
      placeholder: |
        ```python
        import portly
        portly.kill(8000)
        ```
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: portly version
      description: e.g. 0.1.0 (check `python -c "import portly; print(portly.__version__)"`)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: e.g. 3.12, 3.14t (free-threaded)
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / traceback
      description: Paste any error messages or tracebacks.
      render: shell